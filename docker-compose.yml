# ==============================================================================
# MB PERSONALIZA - DOCKER COMPOSE CONFIGURATION
# HOSTINGER VPS KVM 2 (2 vCPUs, 8 GB RAM, 100 GB NVMe)
# PostgreSQL Independente com Volume Persistente (Sem Exposição Pública da 5432)
# ==============================================================================

services:
  # Banco de Dados PostgreSQL 16 Independente & Persistente
  postgres:
    image: postgres:16-alpine
    container_name: mbpersonaliza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${SQL_DB_NAME:-mb_personaliza}}
      POSTGRES_USER: ${POSTGRES_USER:-${SQL_USER:-mb_app_user}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${SQL_PASSWORD:-change_me_in_env}}
      TZ: America/Sao_Paulo
    expose:
      - "5432"
    volumes:
      # Volume persistente isolado do ciclo de atualização da aplicação
      - postgres_data:/var/lib/postgresql/data
      - ./data/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${SQL_USER:-mb_app_user}} -d ${POSTGRES_DB:-${SQL_DB_NAME:-mb_personaliza}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mb_network

  # Aplicação Node.js + Express + React 19 + Workers
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbpersonaliza_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Armazenamento persistente de uploads (garante que atualizações não apaguem arquivos)
      - uploads_data:/app/uploads
      # Armazenamento de backups locais gerados automaticamente
      - backups_data:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.80'
          memory: 4096M
        reservations:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - mb_network

  # Nginx Reverse Proxy com HTTP/2, Gzip e suporte a SSL Let's Encrypt
  nginx:
    image: nginx:1.27-alpine
    container_name: mbpersonaliza_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/mbpersonaliza.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy
    networks:
      - mb_network

  # Renovação automática de certificados SSL Let's Encrypt
  certbot:
    image: certbot/certbot:latest
    container_name: mbpersonaliza_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - mb_network

# Volumes persistentes independentes do ciclo de vida dos containers
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  mb_network:
    driver: bridge
