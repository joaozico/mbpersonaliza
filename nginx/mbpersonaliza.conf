# ==============================================================================
# MB PERSONALIZA - CONFIGURAÇÃO DO NGINX REVERSE PROXY
# HOSTINGER VPS KVM 2 - DOMÍNIO: mbpersonaliza.com.br / www.mbpersonaliza.com.br
# ==============================================================================

# Upstream para o container Node.js da aplicação
upstream app_backend {
    server app:3000;
    keepalive 32;
}

# Redirecionamento HTTP -> HTTPS e validação ACME Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name mbpersonaliza.com.br www.mbpersonaliza.com.br;

    # Desafio Let's Encrypt para emissão e renovação automática de SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redireciona todo o tráfego HTTP para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS com SSL/TLS Seguro
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mbpersonaliza.com.br www.mbpersonaliza.com.br;

    # Certificados SSL gerenciados pelo Certbot
    ssl_certificate /etc/letsencrypt/live/mbpersonaliza.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbpersonaliza.com.br/privkey.pem;

    # Configurações de Criptografia e Segurança SSL Moderno
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Limite de Upload (necessário para logomarcas e mockups de até 50MB)
    client_max_body_size 50M;

    # Compressão Gzip para performance máxima
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache para arquivos estáticos
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot|otf)$ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Rota principal para a aplicação
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;

        # Suporte a WebSockets e conexões persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeçalhos de Proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts generosos para sincronizações de catálogo e uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
